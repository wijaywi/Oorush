name: Build Windows Node EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: x86_64-pc-windows-msvc

    - name: Build Oorush PoA Node (Release)
      run: cargo build --release --bin oorush-node

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
           name: oorush-node-windows
           path: target/release/oorush-node.exe
