name: Build Windows Node EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.85.1
        targets: x86_64-pc-windows-msvc

    - name: Build Oorush PoA Node (Release)
      run: cargo build --locked --release --bin oorush-node --bin oorush-wallet --bin oorush-miner

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
           name: oorush-windows
           path: |
             target/release/oorush-node.exe
             target/release/oorush-wallet.exe
             target/release/oorush-miner.exe
