name: Create Release

on:
  push:
    tags:
      - 'v*' # Memicu workflow ini jika Anda membuat tag yang berawalan 'v' (misal: v1.0.0)

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.1

      - name: Build Windows binaries
        run: cargo build --locked --release --bin oorush-node --bin oorush-wallet --bin oorush-miner

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
           files: |
             target/release/oorush-node.exe
             target/release/oorush-wallet.exe
             target/release/oorush-miner.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
